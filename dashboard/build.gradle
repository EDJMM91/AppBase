plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.dagger.hilt.android'
}
android {
    namespace 'com.moto.project.dashboard'
    compileSdk 34
    defaultConfig { minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}
dependencies {
    implementation project(':perfil')
    implementation project(':configuracion')
    implementation project(':tema')
    implementation project(':basededatos')
    implementation project(':servicios')
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.material
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.paging.runtime.ktx
    implementation libs.coil
    implementation libs.hilt.android
    kapt libs.hilt.compiler
    implementation libs.koin.core
    implementation libs.koin.android
    implementation libs.koin.androidx.compose
}
